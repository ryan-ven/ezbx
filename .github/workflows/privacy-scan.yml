name: Privacy scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to an exact commit, so a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the whole history, so old commits are checked too
          persist-credentials: false
      - name: Test the scanner itself
        run: sh scripts/privacy-scan-test.sh
      - name: Scan tracked files
        run: sh scripts/privacy-scan.sh --all
      - name: Scan every commit in history
        env:
          # Optional repository secret, one term per line. Without it the
          # private-terms check is skipped here (the local hook still runs it).
          EZBX_PRIVATE_TERMS: ${{ secrets.EZBX_PRIVATE_TERMS }}
        run: sh scripts/privacy-scan.sh --history
